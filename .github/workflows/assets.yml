# CI-first heavy asset pipeline — the local Mac is NEVER the workstation.
#
# OpenCode → version-controlled Blender Python → headless Blender here →
# GLB export → glTF Transform → optimized production assets → R3F lookdev
# → deployed preview → screenshot QA artifacts.
#
# Local machine only edits + reviews. No Blender GUI, no local bakes,
# no local compression batches, no parallel Chromium locally.
# No Blender MCP anywhere near the primary machine (remote/isolated only,
# if ever — deterministic Blender Python + CI is preferred).
#
# Triggers: manual dispatch, or pushes touching the procedural sources,
# the scene code, or the shipped models. Deploy stays in deploy.yml.

name: Heavy Assets (Blender → GLB → optimize + QA)

on:
  workflow_dispatch:
    inputs:
      asset:
        description: 'Asset to build (writing|research|architecture|all)'
        required: false
        default: 'all'
      previews:
        description: 'Render Eevee previews + visual diff crops'
        required: false
        default: 'true'
      optimize:
        description: 'Optimization level (lookdev = dedup/prune only, ship = +meshopt/webp)'
        required: false
        default: 'lookdev'
      qa:
        description: 'Run screenshot QA against the deployed site'
        required: false
        default: 'true'
      qa_url:
        description: 'Site URL for screenshot QA'
        required: false
        default: 'https://zwoc-228.github.io/Portfolio_2026/'
  push:
    paths:
      - 'tools/blender/**'
      - 'src/scene/**'
      - 'public/models/**'
      - '.github/workflows/assets.yml'

permissions:
  contents: read

concurrency:
  group: heavy-assets
  cancel-in-progress: true

env:
  BLENDER_VERSION: '4.2.0'
  # Homepage-scale budgets: 1–2K normals/roughness only. No 8K by default.
  CC0_TEX_SIZE: '2k'

jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (glTF Transform tooling)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install headless Blender ${{ env.BLENDER_VERSION }}
        run: |
          set -euo pipefail
          BL=blender-${BLENDER_VERSION}-linux-x64
          curl -sL -o /tmp/blender.tar.xz "https://download.blender.org/release/Blender4.2/${BL}.tar.xz"
          tar -xf /tmp/blender.tar.xz -C /tmp
          echo "/tmp/${BL}" >> "$GITHUB_PATH"
          /tmp/${BL}/blender --version

      - name: Install glTF Transform
        run: |
          npm install --no-save @gltf-transform/cli@^4.1.0
          npx gltf-transform --version

      - name: (Optional) Fetch CC0 PBR maps (1–2K, Poly Haven / ambientCG)
        # Pinned URLs live in tools/blender/cc0_sources.txt when added.
        # Files land in vendor/cc0/ for Blender + web use.
        run: |
          mkdir -p vendor/cc0 public/textures
          if [ -f tools/blender/cc0_sources.txt ]; then
            (cd vendor/cc0 && xargs -a ../../tools/blender/cc0_sources.txt -I{} curl -sSL -O {})
            ls -la vendor/cc0
          else
            echo "No cc0_sources.txt yet — procedural stand-ins remain. See LOOKDEV_AUDIT.md."
          fi

      - name: Build GLBs headless (canonical build_*.py, one at a time)
        # Writing/Research = procedural (controlled, simple).
        # Architecture = IMPORT of public/models/architecture.glb + fix
        # (normals / micro-bevel / UV validate / production material slots).
        # Never a generative rebuild of the architectural design.
        run: |
          set -euo pipefail
          ASSET="${{ inputs.asset || 'all' }}"
          mkdir -p public/models
          run_one() { echo "=== $1 ==="; blender --background --python "tools/blender/build_$1.py" -- public/models; }
          if [ "$ASSET" = writing ] || [ "$ASSET" = all ]; then run_one writing; fi
          if [ "$ASSET" = research ] || [ "$ASSET" = all ]; then run_one research; fi
          if [ "$ASSET" = architecture ] || [ "$ASSET" = all ]; then run_one architecture; fi

      - name: Bake crevice AO (Cycles one-off, 1024 atlas)
        run: |
          set -euo pipefail
          BL_PREVIEW_ENGINE=cycles blender --background --python tools/blender/bake.py -- public/textures "${{ inputs.asset || 'all' }}" || echo "AO bake skipped/failed — keeping checked-in *_ao.png"

      - name: Inspect GLBs (glTF Transform report, always)
        run: |
          set -euo pipefail
          mkdir -p inspect
          for f in public/models/writing.glb public/models/research.glb public/models/architecture.glb; do
            base="$(basename "$f" .glb)"
            npx gltf-transform inspect "$f" > "inspect/${base}.txt" 2>&1 || true
          done
          cat inspect/*.txt

      - name: Optimize GLBs (NO Draco — default R3F loader lacks decoder)
        # Lookdev default: dedup + prune ONLY (zero visual change).
        # Visual quality first — meshopt/webp/resizing only at ship level,
        # after raw production assets visually pass.
        run: |
          set -euo pipefail
          mkdir -p dist-models
          LEVEL="${{ inputs.optimize || 'lookdev' }}"
          for f in public/models/writing.glb public/models/research.glb public/models/architecture.glb; do
            base="$(basename "$f" .glb)"
            if [ "$LEVEL" = ship ]; then
              npx gltf-transform optimize "$f" "dist-models/${base}.opt.glb" \
                --compress meshopt --texture-compress webp || cp "$f" "dist-models/${base}.opt.glb"
            else
              npx gltf-transform dedup "$f" "dist-models/${base}.opt.glb" || cp "$f" "dist-models/${base}.opt.glb"
              npx gltf-transform prune "dist-models/${base}.opt.glb" "dist-models/${base}.opt.glb" || true
            fi
          done
          ls -la dist-models

      - name: Eevee previews (CI renders, not local)
        if: ${{ inputs.previews != 'false' }}
        run: |
          set -euo pipefail
          mkdir -p lookdev
          cp public/models/*preview*.png lookdev/ 2>/dev/null || true
          ls -la lookdev || true

      - name: Upload production GLBs
        uses: actions/upload-artifact@v4
        with:
          name: homepage-glb-optimized
          path: dist-models/
          retention-days: 30

      - name: Upload inspect reports + lookdev previews
        uses: actions/upload-artifact@v4
        with:
          name: lookdev-previews
          path: |
            inspect/
            lookdev/
          retention-days: 30

  screenshot-qa:
    # Pixels for the visual critic (user): full frames + material crops
    # from the DEPLOYED site, bundled with the active reference.
    # NOTE: CI Chromium uses software GL — composition/palette/console QA
    # is trustworthy; final acrylic/metal judgment stays on the user's
    # real GPU (manual role: view, judge, give art-direction feedback).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ inputs.qa != 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Chromium (single instance, sequential viewports)
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Capture homepage + crops from live site
        run: |
          set -euo pipefail
          mkdir -p qa
          node scripts/visual-check.mjs --url "${{ inputs.qa_url || 'https://zwoc-228.github.io/Portfolio_2026/' }}" --crops --out qa
          if [ -f reference/final-home.png ]; then cp reference/final-home.png qa/reference.png
          else cp reference/ui-baseline.png qa/reference.png; fi
          ls -la qa

      - name: Upload QA bundle (frames + crops + reference)
        uses: actions/upload-artifact@v4
        with:
          name: homepage-qa
          path: qa/
          retention-days: 30
