name: ChatGPT Douban Cover Fetch
on:
  push:
    branches:
      - chatgpt-douban-covers-temp
    paths:
      - ".github/workflows/chatgpt-douban-covers.yml"
      - "chatgpt_tmp/db-book.csv"
  workflow_dispatch:

jobs:
  fetch-covers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: python -m pip install --quiet requests pillow
      - name: Fetch and normalize covers
        shell: bash
        run: |
          python - <<'PY'
          import csv, io, json, os, time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import quote
          import requests
          from PIL import Image, ImageDraw

          os.makedirs("covers", exist_ok=True)
          with open("chatgpt_tmp/db-book.csv", "r", encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/129 Safari/537.36",
              "Referer": "https://book.douban.com/",
              "Accept": "image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8",
          }

          def placeholder(idx):
              im = Image.new("RGB", (180, 250), (242, 242, 242))
              d = ImageDraw.Draw(im)
              d.rectangle((2, 2, 177, 247), outline=(160,160,160), width=2)
              d.text((48, 105), "NO COVER", fill=(70,70,70))
              d.text((68, 130), f"#{idx:04d}", fill=(90,90,90))
              return im

          def fetch_one(item):
              idx, row = item
              url = (row.get("封面") or "").strip()
              candidates = [url]
              if url:
                  candidates.append("https://wsrv.nl/?url=" + quote(url, safe="") + "&w=260&output=jpg&q=85")
              last = None
              for attempt in range(3):
                  for u in candidates:
                      if not u:
                          continue
                      try:
                          r = requests.get(u, headers=headers, timeout=25)
                          if r.status_code == 200 and len(r.content) > 300:
                              im = Image.open(io.BytesIO(r.content))
                              im.load()
                              if im.mode not in ("RGB", "L"):
                                  bg = Image.new("RGB", im.size, "white")
                                  if "A" in im.getbands():
                                      bg.paste(im, mask=im.getchannel("A"))
                                  else:
                                      bg.paste(im.convert("RGB"))
                                  im = bg
                              else:
                                  im = im.convert("RGB")
                              im.thumbnail((220, 300), Image.Resampling.LANCZOS)
                              canvas = Image.new("RGB", (220, 300), "white")
                              x = (220-im.width)//2
                              y = (300-im.height)//2
                              canvas.paste(im, (x,y))
                              out = f"covers/{idx:04d}.jpg"
                              canvas.save(out, "JPEG", quality=84, optimize=True, progressive=True)
                              return {"index": idx, "ok": True, "source": u, "bytes": os.path.getsize(out)}
                      except Exception as e:
                          last = repr(e)
                  time.sleep(0.8 * (attempt + 1))
              im = placeholder(idx)
              out = f"covers/{idx:04d}.jpg"
              im.save(out, "JPEG", quality=82)
              return {"index": idx, "ok": False, "error": last, "source": url, "bytes": os.path.getsize(out)}

          results = []
          with ThreadPoolExecutor(max_workers=16) as ex:
              futs = [ex.submit(fetch_one, (i, row)) for i, row in enumerate(rows, 1)]
              for n, fut in enumerate(as_completed(futs), 1):
                  results.append(fut.result())
                  if n % 50 == 0:
                      print(f"processed {n}/{len(rows)}", flush=True)

          results.sort(key=lambda x: x["index"])
          summary = {
              "count": len(results),
              "success": sum(1 for x in results if x["ok"]),
              "failed": sum(1 for x in results if not x["ok"]),
              "failed_indices": [x["index"] for x in results if not x["ok"]],
              "results": results,
          }
          with open("summary.json", "w", encoding="utf-8") as f:
              json.dump(summary, f, ensure_ascii=False, indent=2)
          print(json.dumps({k: summary[k] for k in ("count","success","failed","failed_indices")}, ensure_ascii=False))
          PY
      - name: Verify image count
        run: |
          test "$(find covers -type f -name '*.jpg' | wc -l)" -eq 853
          du -sh covers
      - name: Upload covers
        uses: actions/upload-artifact@v4
        with:
          name: douban-covers-853
          path: |
            covers/
            summary.json
          if-no-files-found: error
          compression-level: 6
