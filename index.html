<!doctype html>
<html lang="en" data-boot="loading" data-scene-ready="false">
<head>
  <meta name="portfolio-build" content="round62">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dedede">
  <title>Yuanlong Zhu — Writing, Architecture, Research</title>
  <meta name="description" content="Writing, architecture and research by Yuanlong Zhu. An interactive portfolio study.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23d4d5d4'/%3E%3Ctext x='7' y='24' font-family='serif' font-size='24'%3EY%3C/text%3E%3C/svg%3E">
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dedede}html[data-boot="loading"] body::before{content:"";position:fixed;inset:0;z-index:9999;background:#dedede}</style>
  <link rel="stylesheet" href="style.css">
</head>
<body class="home">
  <div id="scene" aria-label="Three dimensional portfolio objects"></div>
  <div id="failure" hidden role="status">Interactive 3D could not load on this device. You can still explore the categories below.</div>

  <header class="site-header liquid-header" data-mode="collapsed">
    <button class="header-trigger" type="button" aria-label="Expand navigation" aria-controls="header-links" aria-expanded="false"></button>
    <div id="header-links" class="header-links" inert>
      <nav class="profession" aria-label="Portfolio sections">
        <button data-category="0" data-role-index="2">Writing</button>
        <button data-category="1" data-role-index="0">Architecture</button>
        <button data-category="2" data-role-index="1">Research</button>
      </nav>
      <nav class="primary-links" aria-label="Primary navigation">
        <button id="brand" aria-label="Return to home"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v11h5v-6h4v6h5V9"/></svg></button><button id="archive">Archive</button><button data-dialog="about">About</button><button data-dialog="contact">Contact</button>
      </nav>
    </div>

  </header>
  <aside class="studio-controls" aria-label="Studio lighting"><button id="studio-time-toggle" class="studio-time-toggle" type="button" aria-haspopup="dialog" aria-controls="studio-time-panel" aria-expanded="false"><span class="time-icon" aria-hidden="true">◐</span><span id="studio-time-short">Local</span></button>    <div id="studio-time-panel" class="studio-time-panel" hidden>
      <div class="studio-time-heading"><span>Studio light</span><output id="studio-time-readout">12:00</output></div>
      <select id="studio-timezone" hidden aria-label="Device timezone"><option value="local">Device timezone</option></select>
      <label for="studio-time-range">Time</label>
      <input id="studio-time-range" type="range" min="0" max="23.75" step=".25" value="12">
      <div class="studio-time-actions"><button id="studio-time-auto" type="button" aria-pressed="true">Live local time</button></div>
    </div></aside>



  <main>
    <div id="home-labels" class="home-labels" aria-label="Portfolio categories">
      <button data-category="0" class="object-label object-label--writing">
        <em>Writing</em>
      </button>
      <button data-category="1" class="object-label object-label--architecture">
        <em>Architecture</em>
      </button>
      <button data-category="2" class="object-label object-label--research">
        <em>Research</em>
      </button>
    </div>

    <section id="category" hidden>
      <aside class="category-panel liquid-panel-dom">
        <h1 id="category-title"></h1>
        <div id="filters"></div>
        <div class="category-actions">
          <button id="enter"><span>View projects</span> ↗</button>
          <button id="back">← <span>Back</span></button>
        </div>
      </aside>
      <div id="index-content" class="index-content liquid-panel-dom"></div>
      <aside id="detail-card" class="detail-card" hidden aria-live="polite">
        <button id="detail-close" class="detail-close" type="button" aria-label="Close project detail">← Back</button>
        <img id="detail-image" alt="">
        <div class="detail-copy">
          <small id="detail-kicker"></small>
          <h2 id="detail-title"></h2>
          <p id="detail-text"></p>
          <details class="project-credits"><summary>Project details</summary><div class="detail-meta"><span id="detail-category"></span><span id="detail-year"></span></div></details>
        </div>
        <div id="project-plates" class="project-plates"></div>
      </aside>
    </section>
  </main>



  <dialog id="info" class="liquid-dialog-dom">
    <button class="close" aria-label="Close">×</button>
    <div id="info-body"></div>
  </dialog>

  <script src="assets/gsap.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
